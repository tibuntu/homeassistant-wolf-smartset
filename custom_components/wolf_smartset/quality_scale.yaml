rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions.
  appropriate-polling:
    status: done
    comment: 120 s default, 60 s minimum (Wolf allows one poll per minute), backoff on throttling.
  brands:
    status: done
    comment: Local brand images in brand/ (HA 2026.3+).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No requirements; the API client ships in api/ and uses httpx from HA.
  docs-actions:
    status: exempt
    comment: No custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: No custom actions; entity writes raise translated ServiceValidationError/HomeAssistantError.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: CI fails under 95 % branch coverage.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud account, nothing to discover locally.
  discovery:
    status: exempt
    comment: Cloud account, nothing to discover locally.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices:
    status: todo
    comment: Only one tested installation is named; no list of supported controllers.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: Systems added to the account later are not picked up without a new entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment: Curated parameters use translation keys; the rest keep Wolf's portal labels.
  exception-translations:
    status: todo
    comment: Write errors are translated; UpdateFailed and ConfigEntryAuthFailed messages are not.
  icon-translations:
    status: todo
    comment: No icons.json.
  reconfiguration-flow:
    status: todo
    comment: Changing the selected systems needs a new entry.
  repair-issues: done
  stale-devices:
    status: todo
    comment: No async_remove_config_entry_device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: Own httpx client per entry for the account's cookie jar; check whether create_async_httpx_client fits.
  strict-typing:
    status: todo
    comment: mypy runs without strict mode.
