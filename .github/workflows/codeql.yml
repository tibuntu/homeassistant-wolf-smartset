---
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - release-please--branches--main
  schedule:
    # Weekly, matching the cadence default setup used.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; never cancel the post-merge run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Needed by the `actions` language to read workflow definitions.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Nothing here compiles — no build step to trace.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
